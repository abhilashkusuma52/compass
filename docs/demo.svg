    <text x="24" y="298" fill="#7a7a7a">│  ├─ <tspan fill="#8f8f8f">✓ Read platform docs</tspan></text>
    <text x="24" y="322" fill="#7a7a7a">│  └─ <tspan fill="#f2f2f2">○ Run device tests</tspan></text>
