    <text x="24" y="202" fill="#7a7a7a">├─ <tspan fill="#8f8f8f">✓ Add sign-in screen</tspan></text>
    <text x="24" y="226" fill="#7a7a7a">├─ <tspan fill="#8f8f8f">✓ Fix token refresh bug</tspan></text>
    <text x="24" y="250" fill="#7a7a7a">│  └─ <tspan fill="#8f8f8f">✓ Add test for expired token</tspan></text>
