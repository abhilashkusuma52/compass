<svg xmlns="http://www.w3.org/2000/svg" width="372" height="560" viewBox="0 0 372 560" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <!-- Mock session for the README. Not a real project. -->
  <rect width="372" height="560" fill="#1f1f1f"/>
